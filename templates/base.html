<!doctype html>
<html lang="{{ ui_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t('app_title') }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vintage-paper.css') }}">
<script src="{{ url_for('static', filename='theme-switcher.js', v='ui-controls-2') }}" defer></script>
<script src="{{ url_for('static', filename='ui-language.js', v='ui-controls-2') }}" defer></script>
</head>
<body class="theme-vintage-paper">
<script>
(() => {
  const key = "murakami-corpus-theme";
  let theme = "vintage";
  try {
    const saved = localStorage.getItem(key);
    if (saved === "classic" || saved === "vintage") theme = saved;
  } catch (_) {}
  document.body.classList.toggle("theme-vintage-paper", theme === "vintage");
})();
</script>
<header class="site-header">
  <button type="button" id="nav-back" class="nav-back" title="{{ t('back_title') }}" aria-label="{{ t('back_aria') }}" hidden>←</button>
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true"></span>{{ t('brand_name') }}<span class="brand-sub">{{ t('brand_subtitle') }}</span></a>
  <form class="searchbar" action="{{ url_for('search') }}" method="get">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="{{ t('search_placeholder') }}" autofocus>
    <select name="lang">
      <option value="">{{ t('all_languages') }}</option>
      <option value="zh" {% if lang=='zh' %}selected{% endif %}>{{ t('language_zh') }}</option>
      <option value="ja" {% if lang=='ja' %}selected{% endif %}>{{ t('language_ja') }}</option>
      <option value="en" {% if lang=='en' %}selected{% endif %}>{{ t('language_en') }}</option>
    </select>
    <button type="submit">{{ t('search') }}</button>
  </form>
  <button type="button" class="theme-switcher" data-theme-switcher
          data-theme-vintage-label="{{ t('theme_vintage') }}" data-theme-classic-label="{{ t('theme_classic') }}"
          data-theme-to-vintage="{{ t('theme_to_vintage') }}" data-theme-to-classic="{{ t('theme_to_classic') }}"
          title="{{ t('theme_to_vintage') }}" aria-label="{{ t('theme_to_vintage') }}" aria-pressed="true">{{ t('theme_vintage') }}</button>
  <button type="button" class="ui-language-switcher" data-ui-language-switcher
          data-next-ui-lang="{{ 'en' if ui_lang == 'zh' else 'zh' }}"
          title="{{ t('ui_language_switch') }}" aria-label="{{ t('ui_language_switch') }}">{{ 'EN' if ui_lang == 'zh' else '中文' }}</button>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  {% if writes_allowed %}{{ t('footer_private') }}{% else %}{{ t('footer_public') }}
  <a href="https://github.com/jadexuan155229-dot/murakami-corpus">{{ t('source') }}</a>{% endif %}
</footer>
<script>
(() => {
  // 桌面版（pywebview）没有浏览器外壳，也就没有后退按钮——但历史栈是在的。
  // 这里把它接到页面里，网页版和桌面版共用同一套行为。
  const btn = document.getElementById('nav-back');
  if (!btn) return;

  // 是否从本站的另一个页面跳转而来。
  //
  // 不能用 history.length：WebView2 初始化时会先停在 about:blank 再跳转到应用
  // 地址，历史栈里因此凭空多一条，首页也会被判成"可回退"——按下去退进空白页，
  // 而桌面版没有前进按钮，就卡死了。referrer 只在真的从站内跳转时才有值。
  const canGoBack = document.referrer.startsWith(location.origin);
  if (!canGoBack) return;

  btn.hidden = false;
  btn.addEventListener('click', () => history.back());

  document.addEventListener('keydown', (event) => {
    if (!event.altKey || event.key !== 'ArrowLeft') return;
    // preventDefault 抑制 Chromium 自带的 Alt+← 后退，避免和下面这次叠加成退两页。
    event.preventDefault();
    history.back();
  });
})();
</script>
</body>
</html>
