<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}村上春树语料库{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <button type="button" id="nav-back" class="nav-back" title="返回上一页（Alt+←）" aria-label="返回上一页" hidden>←</button>
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true"></span>羊男的图书馆<span class="brand-sub">村上春树研究语料库</span></a>
  <form class="searchbar" action="{{ url_for('search') }}" method="get">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="跨全部藏书检索：井 / 羊男 / 図書館 / library…" autofocus>
    <select name="lang">
      <option value="">全部语言</option>
      <option value="zh" {% if lang=='zh' %}selected{% endif %}>中文</option>
      <option value="ja" {% if lang=='ja' %}selected{% endif %}>日文</option>
      <option value="en" {% if lang=='en' %}selected{% endif %}>英文</option>
    </select>
    <button type="submit">检索</button>
  </form>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  {% if writes_allowed %}私人研究工具 · 入库文本仅限本地个人研究使用{% else %}开源研究工具 ·
  <a href="https://github.com/jadexuan155229-dot/murakami-corpus">源码</a>{% endif %}
</footer>
<script>
(() => {
  // 桌面版（pywebview）没有浏览器外壳，也就没有后退按钮——但历史栈是在的。
  // 这里把它接到页面里，网页版和桌面版共用同一套行为。
  const btn = document.getElementById('nav-back');
  if (!btn) return;

  // 是否从本站的另一个页面跳转而来。
  //
  // 不能用 history.length：WebView2 初始化时会先停在 about:blank 再跳转到应用
  // 地址，历史栈里因此凭空多一条，首页也会被判成"可回退"——按下去退进空白页，
  // 而桌面版没有前进按钮，就卡死了。referrer 只在真的从站内跳转时才有值。
  const canGoBack = document.referrer.startsWith(location.origin);
  if (!canGoBack) return;

  btn.hidden = false;
  btn.addEventListener('click', () => history.back());

  document.addEventListener('keydown', (event) => {
    if (!event.altKey || event.key !== 'ArrowLeft') return;
    // preventDefault 抑制 Chromium 自带的 Alt+← 后退，避免和下面这次叠加成退两页。
    event.preventDefault();
    history.back();
  });
})();
</script>
</body>
</html>
